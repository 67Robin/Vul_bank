version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: stellarx_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432" 
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d/ 
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: stellarx_backend
    env_file:
      - .env
    environment:
      DB_HOST: db
    ports:
      - "8000:8000"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: stellarx_frontend
    env_file:
      - .env
    ports:
      - "33333:3000"
    depends_on:
      - backend
    restart: unless-stopped    
volumes:
  pgdata: